name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MINIMUM_COVERAGE: "80"

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go environment
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('**/go.sum', '**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ github.job }}-

    - name: Build the code
      run: go build -v ./...

    - name: Check the built binary reports its version
      run: |
        make build
        ./pico8-data-extractor --version

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --config=./.golangci.yml --verbose --timeout=5m

  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go environment
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('**/go.sum', '**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ github.job }}-

    - name: Vet the code
      run: go vet ./...

    - name: Run the tests
      run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout=20m ./...

    - name: Check coverage
      run: |
        total="$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3) - 1)}')"
        echo "total coverage: ${total}%"
        if awk "BEGIN { exit !($total < $MINIMUM_COVERAGE) }"; then
          echo "coverage ${total}% is below the required ${MINIMUM_COVERAGE}%"
          exit 1
        fi
